# .pre-commit-config.yaml — fast per-commit gates. Stock hygiene hooks
# from pre-commit-hooks, plus local hooks for the fast half of `make
# check` (lint). The full test suite is intentionally NOT run per-commit —
# it's slow, and "run tests before you commit" is a norm, not a per-commit
# enforcement (C6.6). Run `make test` (or `make check`) before pushing.
#
# Bootstrap once: `make hooks` — it installs BOTH the pre-commit and
# commit-msg stages. Run on demand: `pre-commit run --all-files`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # testdata fixtures are byte-exact by design (a captured transcript's
      # fingerprint is asserted against them; one deliberately ends
      # mid-line) — the fixers must not touch them. vendor/ is upstream's
      # bytes verbatim (go mod vendor output); the fixers and Go hooks
      # must not touch it either.
      - id: trailing-whitespace
        exclude: '/testdata/|^vendor/'
      - id: end-of-file-fixer
        exclude: '/testdata/|^vendor/'
      - id: check-yaml
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]

      - id: gofumpt
        name: gofumpt -l
        entry: contrib/check-gofumpt
        language: system
        files: '\.go$'
        exclude: '^vendor/'

      - id: golangci-lint
        name: golangci-lint run
        entry: golangci-lint run
        language: system
        pass_filenames: false
        files: '\.go$'

      - id: conventional-commit-msg
        name: conventional commit message
        entry: contrib/check-commit-msg
        language: system
        stages: [commit-msg]
